.ash{animation:ashfall 14s linear infinite}
.flick{animation:flick 2.6s ease-in-out infinite}
.smoke{animation:rise 9s ease-out infinite;transform-box:fill-box;transform-origin:center}

@keyframes flap{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-6deg)}}
.mist{animation:drift 20s ease-in-out infinite}
.flag{animation:flap 3s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
@media (prefers-reduced-motion: reduce){.ash,.flick,.smoke,.mist,.flag{animation:none}}
</style>
